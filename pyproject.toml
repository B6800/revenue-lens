[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-lens"
version = "0.1.0"
description = "Retail intelligence API and dashboard for revenue, customer, and anomaly analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39,<2.0", "requests>=2.32,<3.0"]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.revenue_lens.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
